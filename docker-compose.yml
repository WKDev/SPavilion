
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uhBscN4gshrqiwJc
      POSTGRES_DB: s_pavilion
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d s_pavilion"]
      interval: 10s
      timeout: 5s
      retries: 5

    profiles:
      - default
      - mock
      - db
    networks:
      - s-pavilion-network
    restart: unless-stopped

  # NestJS Backend (Disabled - Running on Windows host directly)
