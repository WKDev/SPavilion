
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uhBscN4gshrqiwJc
      POSTGRES_DB: s_pavilion
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d s_pavilion"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - s-pavilion-network
    restart: unless-stopped

  # MediaMTX RTSP to WebRTC/HLS converter
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    environment:
      TZ: Asia/Seoul
    ports:
      - "9554:8554"  # RTSP (using 9554 on host to avoid Windows port conflicts)
      - "8889:8889"  # WebRTC
      - "8887:8890"  # HLS (changed from 8888 to 8887 to avoid Windows port conflict)
      - "8189:8189/udp"  # WebRTC UDP

    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - s-pavilion-network
    restart: unless-stopped

  # YOLOv8 Detection Service
  detection-service:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: detection-service
    working_dir: /app
    environment:
      IPCAM_URL: rtsp://admin:sidsid965@192.168.1.64:554
      API_URL: http://host.docker.internal:3000 # NestJS API URL (backend running on Windows host)
      RTSP_URL: rtsp://mediamtx:8554/camera # MediaMTX RTSP URL to ingest video stream
      CAMERA_INDEX: ${CAMERA_INDEX:-0}  # Allow override for Windows webcam
      CELL_SIZE: 16
      TZ: Asia/Seoul
      # Mock environment variables
      MOCK_MODE: ${MOCK_MODE:-false}
      USE_GSTREAMER: ${USE_GSTREAMER:-false}
      USE_DETECTION: ${USE_DETECTION:-true}  # Enable YOLOv8 detection
      MOCK_VIDEO_FILE: /app/test-video.mp4
      PLATFORM: ${PLATFORM:-windows}

    # privileged: true
    gpus: all
    # group_add:
    # - "44"  # video 그룹 (카메라 접근 권한용)
    depends_on:
      - mediamtx

    volumes:
      - ./detection-service:/app
      - /app/__pycache__
    networks:
      - s-pavilion-network
    restart: unless-stopped
    command: python3 main.py
      
  nextjs:
    build:
      context: ./next        # Dockerfile 있는 폴더
      dockerfile: Dockerfile
      args:
        # 빌드 시점에 필요한 NEXT_PUBLIC_* 환경변수 (.env.local에서 읽음)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_WEBRTC_URL: ${NEXT_PUBLIC_WEBRTC_URL:-http://localhost:8889}
    platform: linux/amd64
    container_name: s-pavilion-nextjs
    # .env.local 파일에서 런타임 환경변수 로드
    env_file:
      - ./next/.env.local
    environment:
      TZ: Asia/Seoul
      NODE_OPTIONS: --max-old-space-size=4096
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - s-pavilion-network
    restart: unless-stopped
    shm_size: 4gb

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"
    
volumes:
  postgres:
    driver: local

networks:
  s-pavilion-network:
    driver: bridge
