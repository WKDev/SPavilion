
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: uhBscN4gshrqiwJc
      POSTGRES_DB: s_pavilion
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d s_pavilion"]
      interval: 10s
      timeout: 5s
      retries: 5

    profiles:
      - default
      - mock
      - db
    networks:
      - s-pavilion-network
    restart: unless-stopped

  # MediaMTX RTSP to WebRTC/HLS converter
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    environment:
      TZ: Asia/Seoul
    ports:
      - "9554:8554"  # RTSP (using 9554 on host to avoid Windows port conflicts)
      - "8889:8889"  # WebRTC
      - "8887:8890"  # HLS (changed from 8888 to 8887 to avoid Windows port conflict)
      - "8189:8189/udp"  # WebRTC UDP

    profiles:
      - default
      - mock
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - s-pavilion-network
    restart: unless-stopped

  # YOLOv8 Detection Service
  detection-service:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: detection-service
    working_dir: /app
    environment:
      IPCAM_URL: rtsp://admin:sidsid965@192.168.1.64:554
      API_URL: http://localhost:3000 # NestJS API URL (backend running on Windows host)
      RTSP_URL: rtsp://mediamtx:8554/camera # MediaMTX RTSP URL to ingest video stream
      CAMERA_INDEX: ${CAMERA_INDEX:-0}  # Allow override for Windows webcam
      CELL_SIZE: 16
      TZ: Asia/Seoul
      # Mock environment variables
      MOCK_MODE: ${MOCK_MODE:-false}
      USE_GSTREAMER: ${USE_GSTREAMER:-false}
      USE_DETECTION: ${USE_DETECTION:-true}  # Enable YOLOv8 detection
      MOCK_VIDEO_FILE: /app/test-video.mp4
      PLATFORM: ${PLATFORM:-windows}

    # privileged: true
    gpus: all
    # group_add:
    # - "44"  # video 그룹 (카메라 접근 권한용)
    depends_on:
      - mediamtx
    profiles:
      - default
      - mock
    volumes:
      - ./detection-service:/app
      - /app/__pycache__
    networks:
      - s-pavilion-network
    restart: unless-stopped
    command: python3 main.py

  # Next.js Frontend (Optional - Can run on Windows host directly)
  # To run on Windows: cd next && npm install && npm run build && npm run start
  nextjs:
    image: node:22-alpine
    container_name: s-pavilion-nextjs
    working_dir: /app
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      # 프록시 사용 시 NEXT_PUBLIC_API_URL 불필요 (상대 경로 /api 사용)
      # 개발 모드에서만 필요: NEXT_PUBLIC_API_URL=http://localhost:3000/api
      # Browser accesses MediaMTX WebRTC on host port 8889
      NEXT_PUBLIC_WEBRTC_URL: http://localhost:8889
    ports:
      - "3001:3001"
    volumes:
      - ./next:/app
      - /app/node_modules  # Anonymous volume for node_modules
      - /app/.next  # Anonymous volume for .next build cache
    networks:
      - s-pavilion-network
    restart: unless-stopped
    command: sh -c "npm install && npm run build && npm run start" 

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "10"
    
volumes:
  postgres:
    driver: local

networks:
  s-pavilion-network:
    driver: bridge
